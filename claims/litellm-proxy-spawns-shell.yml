schema: umbrasec.claims/v1
rule: rules/linux/litellm-proxy-spawns-shell.yml
rule_id: 7b3a1f02-9c5d-4e88-a1b6-2f4c7d9e0a13
rule_sha256: 77278b25a4418279c56e127b8b66112da1b98b658ccc33b90b38cda51e17c7c0
engine: sigma
writeup: research/detecting-litellm-command-injection.html
reviewed: 2026-10-23
event_defaults:
  _synthetic: true
fp_dispositions:
  - bullet: "Scope to LiteLLM hosts/containers to cut generic python parent noise"
    disposition: advice
    reason: "Deployment scoping advice; there is no event shape to reproduce"
claims:
  - id: catches/python-spawns-shell
    kind: catches
    quote: {source: rule, text: "spawned a shell or a common recon/download utility"}
    expect: match
    events:
      - {_note: "the proxy's Python process starts a shell", ParentImage: /usr/bin/python3, Image: /bin/sh}
  - id: catches/gunicorn-spawns-download-tool
    kind: catches
    quote: {source: rule, text: "The LiteLLM proxy process (Python/uvicorn/gunicorn)"}
    expect: match
    events:
      - {_note: "a gunicorn worker starts a download utility", ParentImage: /usr/local/bin/gunicorn, Image: /usr/bin/curl}
      - {_note: "a uvicorn worker starts bash", ParentImage: /usr/local/bin/uvicorn, Image: /bin/bash}
  - id: catches/versioned-interpreter-parent
    kind: catches
    quote: {source: rule, text: "Sensors often report the resolved binary, so the rule also lists versioned interpreter names"}
    expect: match
    events:
      - {_note: "the resolved interpreter python3.9 starts a shell", ParentImage: /usr/bin/python3.9, Image: /bin/sh}
      - {_note: "python3.10", ParentImage: /usr/bin/python3.10, Image: /bin/sh}
      - {_note: "python3.11", ParentImage: /usr/local/bin/python3.11, Image: /bin/bash}
      - {_note: "python3.12", ParentImage: /usr/local/bin/python3.12, Image: /usr/bin/curl}
      - {_note: "python3.13", ParentImage: /usr/bin/python3.13, Image: /bin/sh}
      - {_note: "python3.14", ParentImage: /usr/bin/python3.14, Image: /bin/sh}
  - id: catches/nc-resolved-names
    kind: catches
    quote: {source: rule, text: "the Debian/Ubuntu names nc resolves to"}
    expect: match
    events:
      - {_note: "nc resolved to the OpenBSD variant", ParentImage: /usr/bin/python3, Image: /usr/bin/nc.openbsd}
      - {_note: "nc resolved to the traditional variant", ParentImage: /usr/bin/python3, Image: /bin/nc.traditional}
      - {_note: "the netcat name", ParentImage: /usr/local/bin/gunicorn, Image: /usr/bin/netcat}
  - id: catches/busybox-child
    kind: catches
    quote: {source: rule, text: "and busybox, which is /bin/sh on Alpine and Wolfi images."}
    expect: match
    events:
      - {_note: "on an Alpine image the shell resolves to busybox", ParentImage: /usr/bin/python3, Image: /bin/busybox}
      - {_note: "a uvicorn worker on a Wolfi image", ParentImage: /usr/bin/uvicorn, Image: /usr/bin/busybox}
  - id: false-positive/entrypoint-script
    kind: false-positive
    quote: {source: rule, text: "Init/entrypoint scripts that legitimately shell out at container start"}
    expect: match
    events:
      - {_note: "at container start the proxy's Python process runs its init step through /bin/sh", ParentImage: /usr/local/bin/python3, Image: /bin/sh}
  - id: false-positive/health-check-tooling
    kind: false-positive
    quote: {source: rule, text: "Health-check or sidecar tooling that wraps the proxy in a shell"}
    expect: match
    events:
      - {_note: "interpretation: a health-check hook run by a proxy worker through sh -c, so the worker is the parent. A shell that wraps python is the parent of python and does not match (see near-miss/shell-wraps-python)", ParentImage: /usr/local/bin/gunicorn, Image: /bin/sh}
  - id: false-positive/busybox-image
    kind: false-positive
    quote: {source: rule, text: "On busybox-based images every shell and utility runs as /bin/busybox, so the entrypoint and health-check cases above appear under that name too"}
    expect: match
    events:
      - {_note: "on a busybox-based image the init step at container start runs as /bin/busybox", ParentImage: /usr/local/bin/python3, Image: /bin/busybox}
      - {_note: "on a busybox-based image a health-check hook run by a worker runs as /bin/busybox", ParentImage: /usr/local/bin/gunicorn, Image: /bin/busybox}
  - id: near-miss/python-spawns-ls
    kind: near-miss
    rationale: "ls is not in the child list"
    expect: no-match
    events:
      - {ParentImage: /usr/bin/python3, Image: /usr/bin/ls}
  - id: near-miss/shell-wraps-python
    kind: near-miss
    rationale: "A shell that launches the proxy is the parent, not the child"
    expect: no-match
    events:
      - {_note: "an entrypoint shell starting the proxy", ParentImage: /bin/sh, Image: /usr/bin/python3}
