schema: umbrasec.claims/v1
rule: rules/web/metabase-reset-password-burst.yml
rule_id: d3d4483d-c16d-4515-8453-17a65391aa2a
rule_sha256: d337e97c32189f12afd3bd64e6fa1da2e77c9d74273d15747344538de9b6c908
engine: sigma
writeup: research/mathspace-metabase-internal-tooling.html
reviewed: 2026-10-26
# The rule is an event_count correlation, so every claim runs in sequence mode:
# all events go into one table and expect applies to the set.
event_defaults:
  _synthetic: true
  cs-method: POST
  cs-uri-stem: /api/session/reset_password
  cs-uri-query: ""
fp_dispositions: []
claims:
  - id: catches/ten-requests-in-under-ten-minutes
    kind: catches
    quote: {source: rule, text: "Ten or more requests to Metabase's unauthenticated password-reset endpoint from one client address within ten minutes."}
    expect: match
    generate: {count: 10, start: "2026-08-10T02:00:00Z", step_seconds: 65,
               template: {_note: "one request every 65 seconds from one address, ten in 9m45s, so a 9-minute window would miss it", c-ip: "198.51.100.23"}}
  - id: catches/fast-injection-loop
    kind: catches
    quote: {source: writeup, text: "Ten resets from one address in ten minutes is not a forgetful employee."}
    expect: match
    generate: {count: 40, start: "2026-08-10T02:00:00Z", step_seconds: 2,
               template: {_note: "an automated loop, forty requests in 80 seconds", c-ip: "198.51.100.23"}}
  - id: catches/payload-in-post-body
    kind: catches
    quote: {source: rule, text: "so it also sees an exploit that carries its payload in the POST body, which the request-line rule metabase-reset-password-sqli cannot."}
    expect: match
    generate: {count: 12, start: "2026-08-10T02:00:00Z", step_seconds: 20,
               template: {_note: "POSTs with an empty query string, the shape the request-line rule's post-body blind spot proves it misses", c-ip: "198.51.100.23", cs-uri-query: ""}}
  - id: false-positive/scanner-or-testing
    kind: false-positive
    quote: {source: rule, text: "Vulnerability scanners and authorised testing that hit the endpoint repeatedly"}
    expect: match
    generate: {count: 15, start: "2026-10-23T10:00:00Z", step_seconds: 3,
               template: {_note: "a scanner works through the endpoint with GET probes", cs-method: GET, c-ip: "192.0.2.50", cs-uri-query: "token=probe{i}"}}
  - id: false-positive/proxy-logs-own-address
    kind: false-positive
    quote: {source: rule, text: "A reverse proxy or load balancer that logs its own address as c-ip"}
    expect: match
    generate: {count: 10, start: "2026-10-23T09:00:00Z", step_seconds: 50,
               template: {_note: "ten different users' single resets, all logged with the proxy's address", c-ip: "10.0.0.5"}}
  - id: false-positive/shared-egress-after-forced-change
    kind: false-positive
    quote: {source: rule, text: "Many users behind one NAT or office egress address resetting at the same time"}
    expect: match
    generate: {count: 25, start: "2026-10-23T09:00:00Z", step_seconds: 15,
               template: {_note: "a forced password change: an office's users reset within minutes, behind one NAT address", c-ip: "203.0.113.80"}}
  - id: near-miss/nine-requests
    kind: near-miss
    rationale: "One below the gte 10 threshold"
    expect: no-match
    generate: {count: 9, start: "2026-08-10T02:00:00Z", step_seconds: 1,
               template: {c-ip: "198.51.100.23"}}
  - id: near-miss/other-endpoint
    kind: near-miss
    rationale: "The base rule selects the reset_password stem; forgot_password is a different endpoint"
    expect: no-match
    generate: {count: 10, start: "2026-08-10T02:00:00Z", step_seconds: 1,
               template: {c-ip: "198.51.100.23", cs-uri-stem: /api/session/forgot_password}}
  - id: blind-spot/few-requests
    kind: blind-spot
    quote: {source: rule, text: "an exploit that succeeds in fewer than ten requests"}
    expect: no-match
    generate: {count: 3, start: "2026-08-10T02:00:00Z", step_seconds: 5,
               template: {_note: "three requests are enough for an exploit that needs no blind extraction", c-ip: "198.51.100.23"}}
  - id: blind-spot/paced-requests
    kind: blind-spot
    quote: {source: rule, text: "one paced so that no ten-minute window holds ten"}
    expect: no-match
    generate: {count: 30, start: "2026-08-10T02:00:00Z", step_seconds: 70,
               template: {_note: "thirty requests, one every 70 seconds, so any ten-minute window holds nine", c-ip: "198.51.100.23"}}
  - id: blind-spot/many-source-addresses
    kind: blind-spot
    quote: {source: rule, text: "or one spread across many source addresses stays under the threshold."}
    expect: no-match
    generate: {count: 30, start: "2026-08-10T02:00:00Z", step_seconds: 5,
               template: {_note: "thirty requests in 150 seconds, rotated across thirty addresses", c-ip: "198.51.100.{i}"}}
