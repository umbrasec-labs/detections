schema: umbrasec.claims/v1
rule: queries/kql/app-credential-added.kql
rule_id: null
rule_sha256: 70024ee0310acfbe8c0361608afa0df19382eaae48d61c9eff6863d059c13abd
engine: kusto
writeup: research/detecting-oauth-consent-phishing.html
reviewed: 2026-10-25
# Not executed: there is no Kusto engine in CI yet. Dynamic columns are given as
# JSON strings, the way a CSV or JSON ingest would carry them. Graph types every
# modifiedProperties newValue and oldValue as String; the KeyDescription value
# inside is a JSON array of "[KeyIdentifier=...,KeyType=...,KeyUsage=...,DisplayName=...]"
# strings, the shape Microsoft's own Sentinel rules parse (Microsoft Learn does not
# document it). KeyType AsymmetricX509Cert and KeyUsage Verify are the examples the
# Graph keyCredential resource gives. KeyType=Password for a client secret comes from
# Microsoft's Defender hunting query "Add uncommon credential type to application";
# the KeyUsage a secret carries is not documented, so the secret event assumes Verify
# (the query keeps the row whatever the usage is). Update service principal and
# Update application come from Microsoft's security operations guide for
# applications; whether they carry KeyDescription is not verified, so that event's
# shape is assumed.
event_defaults:
  _synthetic: true
  TimeGenerated: "2026-10-23T10:00:00Z"
  CorrelationId: "00000000-0000-0000-0000-0000000000c1"
  Result: success
  InitiatedBy: '{"user": {"userPrincipalName": "admin@example.com"}}'
claims:
  - id: catches/certificate-added-to-application
    kind: catches
    quote: {source: rule, text: "New client secret or certificate on an application or service principal"}
    expect: match
    table: AuditLogs
    events:
      - {_note: "a second certificate added to an app that already had one", OperationName: Update application - Certificates and secrets management, TargetResources: '[{"type": "Application", "displayName": "Example Reporting App", "id": "00000000-0000-0000-0000-0000000000b1", "modifiedProperties": [{"displayName": "KeyDescription", "newValue": "[\"[KeyIdentifier=00000000-0000-0000-0000-0000000000a1,KeyType=AsymmetricX509Cert,KeyUsage=Verify,DisplayName=example-cert-1]\", \"[KeyIdentifier=00000000-0000-0000-0000-0000000000a2,KeyType=AsymmetricX509Cert,KeyUsage=Verify,DisplayName=example-cert-2]\"]", "oldValue": "[\"[KeyIdentifier=00000000-0000-0000-0000-0000000000a1,KeyType=AsymmetricX509Cert,KeyUsage=Verify,DisplayName=example-cert-1]\"]"}]}]'}
  - id: catches/playbook-en-dash-spelling
    kind: catches
    quote: {source: rule, text: "Microsoft writes a hyphen in its audit reference and an en dash in its IR playbook, so the query matches the words after the dash."}
    expect: match
    table: AuditLogs
    events:
      # The en dash is written as a YAML escape so that no dash character sits in this file.
      - {_note: "the activity spelled with an en dash, as the IR playbook writes it", OperationName: "Update application \u2013 Certificates and secrets management", TargetResources: '[{"type": "Application", "displayName": "Example Reporting App", "id": "00000000-0000-0000-0000-0000000000b1", "modifiedProperties": [{"displayName": "KeyDescription", "newValue": "[\"[KeyIdentifier=00000000-0000-0000-0000-0000000000a1,KeyType=AsymmetricX509Cert,KeyUsage=Verify,DisplayName=example-cert-1]\", \"[KeyIdentifier=00000000-0000-0000-0000-0000000000a2,KeyType=AsymmetricX509Cert,KeyUsage=Verify,DisplayName=example-cert-2]\"]", "oldValue": "[\"[KeyIdentifier=00000000-0000-0000-0000-0000000000a1,KeyType=AsymmetricX509Cert,KeyUsage=Verify,DisplayName=example-cert-1]\"]"}]}]'}
  # The OnServicePrincipal, ByApp and FirstCredential flags are output columns, not
  # filters, and the harness cannot assert columns, so no claim speaks for them.
  - id: catches/service-principal-credentials-added
    kind: catches
    quote: {source: writeup, text: "Add service principal credentials for the service principal"}
    expect: match
    table: AuditLogs
    events:
      - {_note: "first key on a service principal, added by another app", OperationName: Add service principal credentials, InitiatedBy: '{"app": {"displayName": "Example Automation", "servicePrincipalId": "00000000-0000-0000-0000-0000000000d1"}}', TargetResources: '[{"type": "ServicePrincipal", "displayName": "Example Reporting App", "id": "00000000-0000-0000-0000-0000000000b2", "modifiedProperties": [{"displayName": "KeyDescription", "newValue": "[\"[KeyIdentifier=00000000-0000-0000-0000-0000000000a1,KeyType=AsymmetricX509Cert,KeyUsage=Verify,DisplayName=example-cert-1]\"]", "oldValue": "[]"}]}]'}
  - id: catches/client-secret-added-to-application
    kind: catches
    quote: {source: rule, text: "KeyType=Password (a client secret) and AsymmetricX509Cert (a certificate) from the modified properties of these same activities."}
    expect: match
    table: AuditLogs
    events:
      - {_note: "a client secret added to an app that had a certificate", OperationName: Update application - Certificates and secrets management, TargetResources: '[{"type": "Application", "displayName": "Example Reporting App", "id": "00000000-0000-0000-0000-0000000000b1", "modifiedProperties": [{"displayName": "KeyDescription", "newValue": "[\"[KeyIdentifier=00000000-0000-0000-0000-0000000000a1,KeyType=AsymmetricX509Cert,KeyUsage=Verify,DisplayName=example-cert-1]\", \"[KeyIdentifier=00000000-0000-0000-0000-0000000000a3,KeyType=Password,KeyUsage=Verify,DisplayName=example-secret-1]\"]", "oldValue": "[\"[KeyIdentifier=00000000-0000-0000-0000-0000000000a1,KeyType=AsymmetricX509Cert,KeyUsage=Verify,DisplayName=example-cert-1]\"]"}]}]'}
  - id: catches/update-service-principal-activity
    kind: catches
    quote: {source: rule, text: "Microsoft's security-operations guide also lists \"Update service principal\" and \"Update application\" for added credentials"}
    expect: match
    table: AuditLogs
    events:
      - {_note: "a key logged under Update service principal; the shape is assumed", OperationName: Update service principal, TargetResources: '[{"type": "ServicePrincipal", "displayName": "Example Reporting App", "id": "00000000-0000-0000-0000-0000000000b2", "modifiedProperties": [{"displayName": "KeyDescription", "newValue": "[\"[KeyIdentifier=00000000-0000-0000-0000-0000000000a1,KeyType=AsymmetricX509Cert,KeyUsage=Verify,DisplayName=example-cert-1]\"]", "oldValue": "[]"}]}]'}
  - id: near-miss/update-application-without-key
    kind: near-miss
    rationale: "An Update application row that changes no key has no KeyDescription property, so the KeyDescription filter drops it"
    expect: no-match
    table: AuditLogs
    events:
      - {OperationName: Update application, TargetResources: '[{"type": "Application", "displayName": "Example Reporting App", "id": "00000000-0000-0000-0000-0000000000b1", "modifiedProperties": [{"displayName": "DisplayName", "newValue": "\"Example Reporting App 2\"", "oldValue": "\"Example Reporting App\""}]}]'}
  - id: near-miss/key-removed-only
    kind: near-miss
    rationale: "A change that only removes a key leaves no new key description, so set_difference is empty"
    expect: no-match
    table: AuditLogs
    events:
      - {OperationName: Update application - Certificates and secrets management, TargetResources: '[{"type": "Application", "displayName": "Example Reporting App", "id": "00000000-0000-0000-0000-0000000000b1", "modifiedProperties": [{"displayName": "KeyDescription", "newValue": "[\"[KeyIdentifier=00000000-0000-0000-0000-0000000000a1,KeyType=AsymmetricX509Cert,KeyUsage=Verify,DisplayName=example-cert-1]\"]", "oldValue": "[\"[KeyIdentifier=00000000-0000-0000-0000-0000000000a1,KeyType=AsymmetricX509Cert,KeyUsage=Verify,DisplayName=example-cert-1]\", \"[KeyIdentifier=00000000-0000-0000-0000-0000000000a2,KeyType=AsymmetricX509Cert,KeyUsage=Verify,DisplayName=example-cert-2]\"]"}]}]'}
  - id: near-miss/failed-change
    kind: near-miss
    rationale: "The query keeps successful operations only"
    expect: no-match
    table: AuditLogs
    events:
      - {OperationName: Add service principal credentials, Result: failure, TargetResources: '[{"type": "ServicePrincipal", "displayName": "Example Reporting App", "id": "00000000-0000-0000-0000-0000000000b2", "modifiedProperties": [{"displayName": "KeyDescription", "newValue": "[\"[KeyIdentifier=00000000-0000-0000-0000-0000000000a1,KeyType=AsymmetricX509Cert,KeyUsage=Verify,DisplayName=example-cert-1]\"]", "oldValue": "[]"}]}]'}
