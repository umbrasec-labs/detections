schema: umbrasec.claims/v1
rule: rules/web/metabase-reset-password-sqli.yml
rule_id: fbeecaf9-c9de-4071-b9c6-3576b195e679
rule_sha256: bda434f755c66b1985b403a445edfb7d5f82b9a84e255da8ee6db5c2e0638bd2
engine: sigma
writeup: research/mathspace-metabase-internal-tooling.html
reviewed: 2026-10-23
event_defaults:
  _synthetic: true
  cs-method: GET
  cs-uri-stem: /api/session/reset_password
fp_dispositions: []
claims:
  - id: catches/quote-in-query
    kind: catches
    quote: {source: rule, text: "A request to Metabase's unauthenticated password-reset endpoint carrying SQL metacharacters"}
    expect: match
    events:
      - {_note: "one single quote in the token parameter", cs-uri-query: "token=abc'"}
      - {_note: "one single quote as the whole token", cs-uri-query: "token=a'"}
  - id: catches/keyword-markers
    kind: catches
    quote: {source: rule, text: "A request to Metabase's unauthenticated password-reset endpoint carrying SQL metacharacters"}
    expect: match
    events:
      - {_note: "the union and select keywords the rule lists, nothing more", cs-uri-query: "token=x union select"}
      - {_note: "the sleep( marker the rule lists, nothing more", cs-uri-query: "token=sleep("}
  - id: catches/comment-marker
    kind: catches
    quote: {source: rule, text: "CVE-2026-72898 is an unauthenticated SQL injection in /api/session/reset_password"}
    expect: match
    events:
      - {_note: "the -- comment marker the rule lists", cs-uri-query: "token=abc--"}
  - id: false-positive/scanner
    kind: false-positive
    quote: {source: rule, text: "Vulnerability scanners probing the path after public disclosure"}
    expect: match
    events:
      - {_note: "scanner probe after disclosure; the same shape as an attempt", cs-uri-query: "token=1'"}
  - id: false-positive/authorised-testing
    kind: false-positive
    quote: {source: rule, text: "Authorised security testing against the patched endpoint"}
    expect: match
    events:
      - {_note: "an authorised tester's probe of the patched endpoint", cs-uri-query: "token=test'"}
  - id: false-positive/token-with-matched-character
    kind: false-positive
    quote: {source: rule, text: "A password-reset token that legitimately contains a matched character"}
    expect: match
    events:
      - {_note: "a benign token that happens to contain --", cs-uri-query: "token=8f2c--1a"}
      - {_note: "a benign token that happens to contain ;", cs-uri-query: "token=8f2c;1a"}
  - id: excluded/marker-outside-query
    kind: excluded
    quote: {source: rule, text: "the markers are matched in the query string rather than across the whole request"}
    expect: no-match
    events:
      - {_note: "';' in a path parameter of the stem, clean query", cs-uri-stem: "/api/session/reset_password;jsessionid=a1", cs-uri-query: "token=8f2c1a"}
  - id: blind-spot/post-body
    kind: blind-spot
    quote: {source: rule, text: "An exploit that carries its payload in the POST body is invisible to webserver-category logs"}
    expect: no-match
    events:
      - {_note: "payload only in the body; the access log has an empty query", cs-method: POST, cs-uri-query: ""}
      - {_note: "payload only in the body; the access log has no query field", cs-method: POST, cs-uri-query: null}
  - id: near-miss/benign-token
    kind: near-miss
    rationale: "A plain reset token carries no marker"
    expect: no-match
    events:
      - {cs-uri-query: "token=8f2c1a9e"}
      - {cs-uri-query: "token=abc"}
  - id: near-miss/other-endpoint
    kind: near-miss
    rationale: "The endpoint selection is the reset_password stem; a marker on a sibling endpoint is out of scope"
    expect: no-match
    events:
      - {_note: "forgot_password, not reset_password", cs-uri-stem: /api/session/forgot_password, cs-uri-query: "token=a'"}
  - id: undocumented/slash-is-a-wildcard
    kind: undocumented
    summary: "'/*' is a Sigma wildcard, so any '/' in the query string matches (pySigma compiles it to LIKE '%/%'). Escaping it as '/\\*' matches the comment opener only."
    expect: match
    confidence: confirmed
    upstream: https://github.com/umbrasec-labs/umbrasec.dev/issues/3
    events:
      - {_note: "benign redirect parameter with a slash", cs-uri-query: "next=/dashboard/7"}
  - id: undocumented/select-substring
    kind: undocumented
    summary: "'select' is matched as a substring, so a benign word such as 'selection' in the query string fires. Whether real reset links carry such words depends on the deployment."
    expect: match
    confidence: needs-telemetry
    upstream: pending
    events:
      - {_note: "benign parameter value containing the word selection", cs-uri-query: "ref=selection-page"}
