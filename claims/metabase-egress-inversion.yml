      - {TimeGenerated: "2026-08-26T12:00:00Z", SourceIP: "10.0.30.7", DestinationIP: "10.0.20.15", SentBytes: 5000000, ReceivedBytes: 200000000}
      - {TimeGenerated: "2026-08-27T12:00:00Z", SourceIP: "10.0.30.7", DestinationIP: "10.0.20.15", SentBytes: 5000000, ReceivedBytes: 200000000}
      - {_note: "an outside client pulls 2 GB from the host: 2.2 GB that day, 11 times the median", TimeGenerated: "2026-08-27T12:00:00Z", SourceIP: "198.51.100.23", DestinationIP: "10.0.20.15", SentBytes: 20000000, ReceivedBytes: 2000000000}
