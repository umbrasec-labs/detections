schema: umbrasec.claims/v1
rule: queries/kql/metabase-egress-inversion.kql
rule_id: null
rule_sha256: 695da149cdaff5dd814a8fa734a34409336af29c86a65ecb9d91e7aac3fe1bb7
engine: kusto
writeup: research/mathspace-metabase-internal-tooling.html
reviewed: 2026-10-26
# Not executed: there is no Kusto engine in CI yet. The events assume the query's
# own example settings, MetabaseHosts = 10.0.20.15 and SentBytesFromSource = true,
# with TestDay set to datetime(2026-08-27), the day of the download in the writeup.
# Each event stands for one day's traffic on one session. Microsoft documents the
# columns (SourceIP, DestinationIP, SentBytes, ReceivedBytes, TimeGenerated) but not
# which end of a session SentBytes counts from, so the byte direction is assumed.
# The query passed Kusto.Language 12.4.1 (Microsoft's parser) with 0 diagnostics.
event_defaults:
  _synthetic: true
claims:
  - id: catches/bulk-download-by-outside-client
    kind: catches
    quote: {source: rule, text: "A day's outbound bytes from one host measured against that host's own daily median"}
    expect: match
    table: CommonSecurityLog
    events:
      - {_note: "internal reports: the host sends 200 MB of responses", TimeGenerated: "2026-08-20T12:00:00Z", SourceIP: "10.0.30.7", DestinationIP: "10.0.20.15", SentBytes: 5000000, ReceivedBytes: 200000000}
