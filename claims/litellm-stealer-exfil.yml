schema: umbrasec.claims/v1
rule: rules/web/litellm-stealer-exfil.yml
rule_id: 6f6f10d8-c46a-46dc-89ad-c5b9a800ee72
rule_sha256: 2925f112ddbb8c6d48bc849bfcf7f2344f882df4c24ba658941b7e06410c8924
engine: sigma
writeup: null
reviewed: 2026-10-25
event_defaults:
  _synthetic: true
fp_dispositions:
  - bullet: "If the domain ever changes hands, retire the rule"
    disposition: lifecycle
    reason: "A condition for retiring the rule; it will feed a sunset check (domain registration), and there is no event to reproduce"
claims:
  - id: catches/apex-domain
    kind: catches
    quote: {source: rule, text: "litellm.dev is an attacker-controlled lookalike"}
    expect: match
    events:
      - {cs-host: litellm.dev}
  - id: catches/www-subdomain
    kind: catches
    quote: {source: rule, text: "to www.litellm.dev/healthcheck"}
    expect: match
    events:
      - {cs-host: www.litellm.dev}
  - id: catches/mixed-case-host
    kind: catches
    quote: {source: rule, text: "any request to it from your estate is worth a ticket"}
    expect: match
    events:
      - {_note: "equality is case-insensitive", cs-host: LiteLLM.dev}
      - {_note: "endswith is case-insensitive", cs-host: WWW.LiteLLM.Dev}
  - id: catches/uri-fallback
    kind: catches
    quote: {source: rule, text: "The URI selection covers proxies that only log the full URL."}
    expect: match
    events:
      - {_note: "only the full URL is logged", c-uri: "http://litellm.dev/healthcheck"}
      - {_note: "only the full URL is logged, www host", c-uri: "http://www.litellm.dev/healthcheck"}
      - {_note: "only the full URL is logged, with a port", c-uri: "http://litellm.dev:8080/healthcheck"}
      - {_note: "only the full URL is logged, www host with a port", c-uri: "https://www.litellm.dev:443/healthcheck"}
      - {_note: "only the full URL is logged, trailing-dot host", c-uri: "http://litellm.dev./healthcheck"}
      - {_note: "only the full URL is logged, trailing-dot www host with a port", c-uri: "https://www.litellm.dev.:443/healthcheck"}
      - {_note: "a URL with no path", c-uri: "http://litellm.dev"}
      - {_note: "a www URL with no path and a trailing dot", c-uri: "https://www.litellm.dev."}
  - id: catches/host-with-port
    kind: catches
    quote: {source: rule, text: "Hosts logged with a port or with a trailing dot are matched."}
    expect: match
    events:
      - {_note: "apex host logged with a port, no c-uri", cs-host: "litellm.dev:443"}
      - {_note: "apex host with a port, mixed case", cs-host: "LiteLLM.dev:80"}
  - id: catches/subdomain-with-port
    kind: catches
    quote: {source: rule, text: "Hosts logged with a port or with a trailing dot are matched."}
    expect: match
    events:
      - {_note: "www host logged with a port, no c-uri", cs-host: "www.litellm.dev:443"}
      - {_note: "www host with port 80, no c-uri", cs-host: "www.litellm.dev:80"}
  - id: catches/trailing-dot-host
    kind: catches
    quote: {source: rule, text: "Hosts logged with a port or with a trailing dot are matched."}
    expect: match
    events:
      - {_note: "fully qualified apex host with a trailing dot", cs-host: "litellm.dev."}
      - {_note: "fully qualified www host with a trailing dot", cs-host: "www.litellm.dev."}
      - {_note: "trailing dot and a port on the apex host", cs-host: "litellm.dev.:443"}
      - {_note: "trailing dot and a port on the www host", cs-host: "www.litellm.dev.:443"}
  - id: false-positive/analyst-sandbox
    kind: false-positive
    quote: {source: rule, text: "Analysts or sandboxes deliberately resolving or fetching the indicator"}
    expect: match
    events:
      - {_note: "an analyst's sandbox fetching the indicator", cs-host: www.litellm.dev}
  - id: near-miss/real-and-lookalike-domains
    kind: near-miss
    rationale: "The project's real domains, and a name that only ends in litellm.dev without the dot"
    expect: no-match
    events:
      - {cs-host: litellm.ai}
      - {cs-host: docs.litellm.ai}
      - {cs-host: notlitellm.dev}
  - id: near-miss/lookalike-name-with-port
    kind: near-miss
    rationale: "The port selections anchor on the start of the host or on a leading dot, so a name that only ends in litellm.dev stays quiet with a port too"
    expect: no-match
    events:
      - {cs-host: "notlitellm.dev:443"}
  - id: near-miss/litellm-dev-as-a-label-prefix
    kind: near-miss
    rationale: "litellm.dev followed by more labels is a different domain; no host selection matches it"
    expect: no-match
    events:
      - {cs-host: litellm.dev.evil.example}
  - id: near-miss/litellm-dev-as-a-label-prefix-in-uri
    kind: near-miss
    rationale: "The URI fallback is anchored at the host boundary (a slash or a colon after the name), so a full URL on a domain that only starts with litellm.dev stays quiet"
    expect: no-match
    events:
      - {c-uri: "http://litellm.dev.evil.example/healthcheck"}
      - {c-uri: "https://www.litellm.dev.evil.example/healthcheck"}
      - {c-uri: "http://litellm.development.example/x"}
      - {c-uri: "http://notlitellm.dev/healthcheck"}
      - {c-uri: "http://litellm.dev.evil.example"}
