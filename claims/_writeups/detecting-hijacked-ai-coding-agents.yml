schema: umbrasec.claims-writeup/v1
writeup: research/detecting-hijacked-ai-coding-agents.html
section: Honest limitations
sentences:
  - starts: "Each agent fingerprint in these detections, whether a process name, a flag or a wrapper string"
    disposition: prerequisite
    reason: "A version statement; the claims use the fingerprints of the agent versions the rules cite, and a new release needs a new source, which synthetic events cannot supply"
  - starts: "Cursor and Devin coverage rests on vendor docs and shipped code, not on a capture"
    disposition: tested
    claims:
      - ai-agent-shell-risky-command/blind-spot/unconfirmed-agent-left-out
    reason: "Proved against ai-agent-shell-risky-command: a Cursor Helper (Plugin) extension host and the bundled devin binary as the parent of a plain shell credential read stay no-match; the Cursor strings that are covered are proved by its cursor catches claims, and the docs and shipped-code basis is a sourcing statement no synthetic event can settle"
  - starts: "The Claude Code wrapper string that Detection 2 matches comes from watching Claude Code 2.1.310"
    disposition: context
    reason: "A sourcing statement; the wrapper match itself is proved by ai-agent-shell-risky-command catches/claude-wrapper-linux, which quotes the rule's own copy of this limitation"
  - starts: "Detection 2's filter for Claude Code's Linux sandbox drops a row that starts with"
    disposition: tested
    claims:
      - ai-agent-shell-risky-command/excluded/claude-sandbox-wrapper-rows-decoy-read
    reason: "Proved against ai-agent-shell-risky-command: the two sandbox wrapper rows of a decoy credential read, which carry the read itself, stay no-match; the same read is caught on the inner rows (catches/claude-sandbox-inner-rows-decoy-read)"
  - starts: "On macOS the sandbox uses another wrapper, sandbox-exec, which has not been captured"
    disposition: prerequisite
    reason: "Needs a capture of Claude Code's sandbox on macOS; what sandbox-exec's rows look like is not known, so there is no event shape to synthesise"
  - starts: "Credential access is seen only when a credential file or token command is named on a command line."
    disposition: tested
    claims:
      - ai-agent-shell-risky-command/blind-spot/credential-not-named
    reason: "The negative half is proved here; the positive half by ai-agent-shell-risky-command catches/credential-sources"
  - starts: "An agent that reads a file through its own built-in tool starts no process at all"
    disposition: prerequisite
    reason: "A telemetry-availability statement: a built-in tool read starts no process and Sysmon has no read event, so there is no event to synthesise"
  - starts: "Detection 3 cannot tell an agent from the developer typing in the same terminal"
    disposition: context
    reason: "The hunt's scope by design; its KQL claims are not executed, so a tested entry cannot rest on them, and the Source column names the agent only for agent shells: a vscode-terminal row cannot be told from the developer"
  - starts: "Defender for Endpoint may cover part of that gap."
    disposition: context
    reason: "Points to a telemetry source outside these detections; no rule or query in the pack uses it, so there is nothing to execute"
  - starts: "Its DeviceEvents table has an action type, SensitiveFileRead"
    disposition: context
    reason: "A sourcing statement about Microsoft's documentation; nothing to execute"
  - starts: "The Defender portal's built-in schema reference (checked 2026-10-28)"
    disposition: context
    reason: "The splitter does not break after the closing quote, so this joins the next sentence. Both are sourcing statements: the portal's description, and what no public source settles; nothing to execute"
  - starts: "We have not seen it record an agent reading a credential"
    disposition: prerequisite
    reason: "Needs a Defender tenant with coding agents and developer credentials; synthetic events cannot settle what the sensor records"
  - starts: "Before you build on it, run this in your own tenant"
    disposition: context
    reason: "The splitter skips the inline query and joins this sentence to the next. The first half is advice with an ad hoc query that is not a pack file; the second half is validation status, and the Claims Ledger itself reports the all-agent-shells-risky-command claims as not-executed"
  - starts: "None of the three detections has been run against a sensor capture on any OS"
    disposition: prerequisite
    reason: "Needs a sensor capture; the one local capture is a strace trace of Claude Code 2.1.312 on Linux, whose sandbox rows the claims reproduce in redacted form, and synthetic events cannot settle real process names, process trees or recorded command-line forms"
  - starts: "Both Sigma rules pass their claims on synthetic events built from the cited sources"
    disposition: context
    reason: "Restates what the Claims Ledger proves and does not prove, as the detections README says"
  - starts: "They are experimental: tune them against your own logs"
    disposition: context
    reason: "Rule status and tuning advice; the false-positive notes it points to are proved for both Sigma rules; the KQL false positives are not executed"
