schema: umbrasec.claims-writeup/v1
writeup: research/detecting-hijacked-ai-coding-agents.html
section: Honest limitations
sentences:
  - starts: "Each agent fingerprint in these detections, whether a process name, a flag or a wrapper string"
    disposition: prerequisite
    reason: "A version statement; the claims use the fingerprints of the agent versions the rules cite, and a new release needs a new source, which synthetic events cannot supply"
  - starts: "Agents whose process names or launch chain no public source confirms"
    disposition: tested
    claims:
      - ai-agent-shell-risky-command/blind-spot/unconfirmed-agent-left-out
    reason: "Proved against ai-agent-shell-risky-command; Rule 1 has no selection for these agents and Detection 3's Editors list is Code.exe only"
  - starts: "The Claude Code wrapper string that Detection 2 matches comes from watching Claude Code 2.1.310"
    disposition: context
    reason: "A sourcing statement; the wrapper match itself is proved by ai-agent-shell-risky-command catches/claude-wrapper-linux, which quotes the rule's own copy of this limitation"
  - starts: "Credential access is seen only when a credential file or token command is named on a command line."
    disposition: tested
    claims:
      - ai-agent-shell-risky-command/blind-spot/credential-not-named
    reason: "The negative half is proved here; the positive half by ai-agent-shell-risky-command catches/credential-sources"
  - starts: "An agent that reads a file through its own built-in tool starts no process at all"
    disposition: prerequisite
    reason: "A telemetry-availability statement: a built-in tool read starts no process and Sysmon has no read event, so there is no event to synthesise"
  - starts: "Detection 3 cannot tell an agent from the developer typing in the same terminal"
    disposition: context
    reason: "The hunt's scope by design; its KQL claims are not executed, so a tested entry cannot rest on them, and the query has no field that names the agent"
  - starts: "The KQL hunt has been parse-checked with the Kusto language service"
    disposition: context
    reason: "Validation status; the Claims Ledger itself reports the editor-terminal-risky-command claims as not-executed"
  - starts: "None of the three detections has been run against a sensor capture on any OS"
    disposition: prerequisite
    reason: "Needs a sensor capture; synthetic events cannot settle real process names, process trees or recorded command-line forms"
  - starts: "Both Sigma rules pass their claims on synthetic events built from the cited sources"
    disposition: context
    reason: "Restates what the Claims Ledger proves and does not prove, as the detections README says"
  - starts: "They are experimental: tune them against your own logs"
    disposition: context
    reason: "Rule status and tuning advice; the false-positive notes it points to are proved for both Sigma rules; the KQL false positives are not executed"
