schema: umbrasec.claims/v1
rule: rules/cross-platform/ai-agent-cli-headless-approval-bypass.yml
rule_id: efead37d-b263-4f88-843c-39fc390ff510
rule_sha256: 4384ce2aace6f1ff4f9f6a208f1c4abcb5d6793092e2fb799ef8eeeb0b6a1c66
engine: sigma
writeup: research/detecting-hijacked-ai-coding-agents.html
reviewed: 2026-10-27
event_defaults:
  _synthetic: true
fp_dispositions:
  - bullet: "Scope the rule by host group"
    disposition: advice
    reason: "Deployment scoping advice; there is no event shape to reproduce"
claims:
  - id: catches/claude-headless-bypass
    kind: catches
    quote: {source: rule, text: "claude with --dangerously-skip-permissions or --permission-mode bypassPermissions, and -p or --print"}
    expect: match
    events:
      - {_note: "native install on Linux; the image resolves to the versions folder", Image: /home/dev/.local/share/claude/versions/2.1.310, CommandLine: 'claude --dangerously-skip-permissions -p "summarise the repo"'}
      - {_note: "Windows native install, flag right after the quoted image path", Image: 'C:\Users\dev\.local\bin\claude.exe', CommandLine: '"C:\Users\dev\.local\bin\claude.exe" --dangerously-skip-permissions --print "summarise the repo"'}
      - {_note: "the permission-mode spelling of the same bypass", Image: /usr/local/bin/claude, CommandLine: 'claude --permission-mode bypassPermissions -p "summarise the repo"'}
      - {_note: "-p last, prompt on stdin", Image: /usr/local/bin/claude, CommandLine: "claude --dangerously-skip-permissions -p"}
  - id: catches/gemini-headless-bypass
    kind: catches
    quote: {source: rule, text: "gemini with --yolo, -y or --approval-mode yolo, and -p or --prompt"}
    expect: match
    events:
      - {_note: "the --yolo flag", Image: /usr/local/bin/gemini, CommandLine: 'gemini --yolo -p "summarise the repo"'}
      - {_note: "the -y short flag", Image: /usr/local/bin/gemini, CommandLine: 'gemini -y --prompt "summarise the repo"'}
      - {_note: "the approval-mode spelling", Image: /usr/local/bin/gemini, CommandLine: 'gemini --approval-mode yolo --prompt="summarise the repo"'}
  - id: catches/node-launched-cli
    kind: catches
    quote: {source: rule, text: "Gemini CLI runs under node, Claude Code ran under node as an npm package before its native binary, and an npm install of the Copilot CLI runs a node loader (npm-loader.js) that starts the native copilot with the same flags, so for those three the rule also matches node with the CLI name on its command line"}
    expect: match
    events:
      - {_note: "Gemini CLI launched by node on Linux", Image: /usr/bin/node, CommandLine: 'node /usr/local/bin/gemini --yolo -p "summarise the repo"'}
      - {_note: "Claude Code as the 2025 npm package: the claude bin is cli.js, a node script", Image: /usr/bin/node, CommandLine: 'node /usr/local/lib/node_modules/@anthropic-ai/claude-code/cli.js --permission-mode bypassPermissions --print "summarise the repo"'}
      - {_note: "Copilot CLI launched by node on Windows", Image: 'C:\Program Files\nodejs\node.exe', CommandLine: '"C:\Program Files\nodejs\node.exe" C:\Users\dev\AppData\Roaming\npm\copilot -p "summarise the repo" --yolo'}
      - {_note: "npm install since 1.0.64: node runs the loader, which starts the native copilot with the same flags (the second row is the native copilot)", Image: /usr/bin/node, CommandLine: 'node /usr/local/lib/node_modules/@github/copilot/npm-loader.js -p "summarise the repo" --allow-all'}
  - id: catches/codex-headless-bypass
    kind: catches
    quote: {source: rule, text: "codex exec or e with --dangerously-bypass-approvals-and-sandbox"}
    expect: match
    events:
      - {_note: "exec subcommand", Image: /usr/local/bin/codex, CommandLine: 'codex exec --dangerously-bypass-approvals-and-sandbox "summarise the repo"'}
      - {_note: "the e alias on Windows", Image: 'C:\Tools\codex\codex.exe', CommandLine: 'codex.exe e --dangerously-bypass-approvals-and-sandbox "summarise the repo"'}
      - {_note: "flag before the subcommand, prompt on stdin", Image: /usr/local/bin/codex, CommandLine: "codex --dangerously-bypass-approvals-and-sandbox exec"}
  - id: catches/copilot-headless-bypass
    kind: catches
    quote: {source: rule, text: "copilot with --allow-all or --yolo, and -p or --prompt"}
    expect: match
    events:
      - {_note: "--allow-all last", Image: /usr/local/bin/copilot, CommandLine: 'copilot -p "summarise the repo" --allow-all'}
      - {_note: "--allow-all before the prompt", Image: /usr/local/bin/copilot, CommandLine: 'copilot --allow-all -p "summarise the repo"'}
      - {_note: "--yolo with the --prompt= form", Image: 'C:\Tools\copilot.exe', CommandLine: 'copilot.exe --prompt="summarise the repo" --yolo'}
  - id: catches/amazon-q-headless-bypass
    kind: catches
    quote: {source: rule, text: "q or qchat with --trust-all-tools or -a, and --no-interactive or --non-interactive"}
    expect: match
    events:
      - {_note: "the chat subcommand form", Image: /usr/local/bin/q, CommandLine: 'q chat --trust-all-tools --no-interactive "summarise the repo"'}
      - {_note: "short flag and the non-interactive alias", Image: /usr/local/bin/qchat, CommandLine: 'qchat chat -a --non-interactive "summarise the repo"'}
  - id: catches/s1ngularity-shape
    kind: catches
    quote: {source: rule, text: 'The Nx "s1ngularity" packages (August 2025) started claude, gemini and q this way from a node postinstall script.'}
    expect: match
    events:
      - {_note: "August 2025: claude was the npm package, so the launched process is node running the claude script", ParentImage: /usr/bin/node, Image: /usr/bin/node, CommandLine: 'node /usr/local/bin/claude --dangerously-skip-permissions -p "summarise the repo"'}
      - {_note: "the same launch against today's native binary", ParentImage: /usr/bin/node, Image: /usr/local/bin/claude, CommandLine: 'claude --dangerously-skip-permissions -p "summarise the repo"'}
      - {_note: "node starts gemini, which itself runs under node", ParentImage: /usr/bin/node, Image: /usr/bin/node, CommandLine: 'node /usr/local/bin/gemini --yolo -p "summarise the repo"'}
      - {_note: "node starts q with the chat subcommand", ParentImage: /usr/bin/node, Image: /usr/local/bin/q, CommandLine: 'q chat --trust-all-tools --no-interactive "summarise the repo"'}
  - id: catches/amazon-q-no-chat-subcommand
    kind: catches
    quote: {source: rule, text: "Amazon Q for VS Code 1.84.0 (CVE-2025-8217) carried an injected q --trust-all-tools --no-interactive launch through a shell, with no chat subcommand; it never ran, because of a syntax error."}
    expect: match
    events:
      - {_note: "exec runs it through a shell, so the parent is sh", ParentImage: /bin/sh, Image: /usr/local/bin/q, CommandLine: 'q --trust-all-tools --no-interactive "summarise the repo"'}
  - id: near-miss/interactive-bypass
    kind: near-miss
    rationale: "Bypass flag without headless mode: a developer running the agent interactively, which the docs describe for isolated containers. The Cursor branch is the exception: it needs no headless flag, so an interactive Cursor --yolo session matches (catches/cursor-interactive-yolo)"
    expect: no-match
    events:
      - {_note: "no prompt at all", Image: /usr/local/bin/claude, CommandLine: "claude --dangerously-skip-permissions"}
      - {_note: "a positional prompt still opens the interactive session", Image: /usr/local/bin/claude, CommandLine: 'claude --dangerously-skip-permissions "summarise the repo"'}
  - id: near-miss/headless-no-bypass
    kind: near-miss
    rationale: "Headless with the permission prompts left on is ordinary scripted use"
    expect: no-match
    events:
      - {Image: /usr/local/bin/claude, CommandLine: 'claude -p "summarise the repo"'}
  - id: near-miss/claude-allow-dangerously-skip-permissions
    kind: near-miss
    quote: {source: rule, text: "Claude Code's --allow-dangerously-skip-permissions only adds bypass mode to the Shift+Tab cycle without starting in it, and does not match"}
    rationale: "The longer flag shares the words of the bypass flag but does not start in bypass mode; a looser match on a shorter part such as skip-permissions would fire on it"
    expect: no-match
    events:
      - {_note: "headless, longer flag only", Image: /usr/local/bin/claude, CommandLine: 'claude --allow-dangerously-skip-permissions -p "summarise the repo"'}
  - id: near-miss/copilot-allow-all-tools-only
    kind: near-miss
    quote: {source: rule, text: "A Copilot run that passes only --allow-all-tools is not covered"}
    rationale: "--allow-all is a prefix of --allow-all-tools, and the rule matches --allow-all only before a space or at the end of the line. A -p run with no permission options denies every approval-gated request, so a pipeline that needs the shell passes --allow-all-tools, an --allow-tool grant, --assisted-approval or COPILOT_ALLOW_ALL; --allow-all-tools is the common CI form, so matching it alone would fire on every pipeline (a noise call, not a claim that it is required)"
    expect: no-match
    events:
      - {Image: /usr/local/bin/copilot, CommandLine: 'copilot -p "summarise the repo" --allow-all-tools'}
      - {_note: "the flag in the middle of the command line", Image: /usr/local/bin/copilot, CommandLine: 'copilot --allow-all-tools -p "summarise the repo"'}
  - id: near-miss/gemini-positional-prompt
    kind: near-miss
    quote: {source: rule, text: "A Gemini positional prompt without -p is not matched"}
    rationale: "A positional prompt defaults to interactive mode in a TTY; without a TTY the behaviour is not confirmed"
    expect: no-match
    events:
      - {Image: /usr/local/bin/gemini, CommandLine: 'gemini --yolo "summarise the repo"'}
  - id: near-miss/npx-auto-yes-gemini
    kind: near-miss
    quote: {source: rule, text: "Under node, Gemini's -y is not matched, because npx takes -y for itself"}
    rationale: "npx -y only skips npx's own install prompt; Gemini runs headless with its approvals on"
    expect: no-match
    events:
      - {_note: "npx on Linux", Image: /usr/bin/node, CommandLine: 'npx -y @google/gemini-cli -p "summarise the repo"'}
      - {_note: "npx on Windows: node.exe runs npx-cli.js", Image: 'C:\Program Files\nodejs\node.exe', CommandLine: '"C:\Program Files\nodejs\node.exe" "C:\Program Files\nodejs\node_modules\npm\bin\npx-cli.js" -y @google/gemini-cli -p "summarise the repo"'}
  - id: blind-spot/copilot-allow-all-spelled-out
    kind: blind-spot
    quote: {source: rule, text: "nor one that spells --allow-all out as its three separate flags"}
    expect: no-match
    events:
      - {Image: /usr/local/bin/copilot, CommandLine: 'copilot -p "summarise the repo" --allow-all-tools --allow-all-paths --allow-all-urls'}
  - id: catches/codex-yolo-alias
    kind: catches
    quote: {source: rule, text: "codex exec or e with --dangerously-bypass-approvals-and-sandbox or its --yolo alias"}
    rationale: "Codex's source defines --yolo as an alias of --dangerously-bypass-approvals-and-sandbox: https://github.com/openai/codex/blob/970111f6cb62cc02fe36a82ea7d71b37a2889c97/codex-rs/utils/cli/src/shared_options.rs#L43-L59"
    expect: match
    events:
      - {Image: /usr/local/bin/codex, CommandLine: 'codex exec --yolo "summarise the repo"'}
      - {_note: "the e alias on Windows, the flag before the subcommand", Image: 'C:\Tools\codex\codex.exe', CommandLine: 'codex.exe --yolo e "summarise the repo"'}
  - id: near-miss/codex-not-so-yolo
    kind: near-miss
    quote: {source: rule, text: "Codex's --not-so-yolo does not match: it is an alias of --approve-for-me, which sends approval requests to automatic review instead of switching them off."}
    rationale: "--not-so-yolo contains the letters yolo but turns on automatic review, not a bypass (https://github.com/openai/codex/blob/970111f6cb62cc02fe36a82ea7d71b37a2889c97/codex-rs/utils/cli/src/shared_options.rs#L43-L59); its text holds yolo but never the --yolo the rule matches, so a looser match on yolo alone would fire on it"
    expect: no-match
    events:
      - {Image: /usr/local/bin/codex, CommandLine: 'codex exec --not-so-yolo "summarise the repo"'}
      - {_note: "the long form of the same option", Image: /usr/local/bin/codex, CommandLine: 'codex exec --approve-for-me "summarise the repo"'}
  - id: false-positive/ci-runner-headless-bypass
    kind: false-positive
    quote: {source: rule, text: "CI runners and disposable containers that run agents headless with approvals off by design"}
    expect: match
    events:
      - {_note: "a pipeline step in a throwaway container", ParentImage: /bin/bash, Image: /usr/local/bin/claude, CommandLine: 'claude -p "summarise the repo" --dangerously-skip-permissions'}
      - {_note: "a CI job running Codex non-interactively", ParentImage: /bin/sh, Image: /usr/local/bin/codex, CommandLine: 'codex exec --dangerously-bypass-approvals-and-sandbox "summarise the repo"'}
  - id: false-positive/developer-script
    kind: false-positive
    quote: {source: rule, text: "A developer scripting an agent on their own workstation with the same flags"}
    expect: match
    events:
      - {_note: "a developer's own shell script", ParentImage: /bin/zsh, Image: /usr/local/bin/gemini, CommandLine: 'gemini --approval-mode yolo -p "summarise the repo"'}
  - id: false-positive/sdk-embedded-agent
    kind: false-positive
    quote: {source: rule, text: "or an application built on an agent SDK that starts the CLI with bypass on"}
    expect: match
    events:
      - {_note: "an application built on an agent SDK starts Claude Code headless with bypass on; argument order illustrative", ParentImage: /usr/bin/node, Image: /usr/local/bin/claude, CommandLine: 'claude --output-format stream-json --verbose --permission-mode bypassPermissions --print -- "summarise the repo"'}
  - id: false-positive/prompt-text-token
    kind: false-positive
    quote: {source: rule, text: "An interactive bypass run whose prompt text happens to contain a headless flag such as -p"}
    expect: match
    events:
      - {_note: "interactive, but the prompt contains mkdir -p", Image: /usr/local/bin/claude, CommandLine: 'claude --dangerously-skip-permissions "run mkdir -p build"'}
  - id: catches/copilot-allow-tool-shell
    kind: catches
    quote: {source: rule, text: "Copilot also matches with a bare shell grant, --allow-tool=shell or --allow-tool shell on its own or first in a list"}
    rationale: "A bare shell permission pattern approves every shell command, because the pattern argument is optional: https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-command-reference#tool-permission-patterns"
    expect: match
    events:
      - {_note: "= form, last on the line", Image: /usr/local/bin/copilot, CommandLine: 'copilot -p "summarise the repo" --allow-tool=shell'}
      - {_note: "space form before the prompt", Image: /usr/local/bin/copilot, CommandLine: 'copilot --allow-tool shell -p "summarise the repo"'}
      - {_note: "shell first in an unquoted list", Image: 'C:\Tools\copilot.exe', CommandLine: 'copilot.exe --allow-tool=shell,write -p "summarise the repo"'}
      - {_note: "= form, double-quoted shell", Image: /usr/local/bin/copilot, CommandLine: 'copilot --allow-tool="shell" -p "summarise the repo"'}
      - {_note: "= form, single-quoted shell", Image: /usr/local/bin/copilot, CommandLine: 'copilot --allow-tool=''shell'' -p "summarise the repo"'}
      - {_note: "space form, shell first in an unquoted list", Image: /usr/local/bin/copilot, CommandLine: 'copilot --allow-tool shell,write -p "summarise the repo"'}
  - id: near-miss/copilot-scoped-shell-grant
    kind: near-miss
    rationale: "A scoped grant such as shell(git:*) approves one command family, and shellcheck is a different word; every matched form needs a space, comma, quote or the end of the line right after shell"
    expect: no-match
    events:
      - {_note: "scoped grant, quoted", Image: /usr/local/bin/copilot, CommandLine: 'copilot --allow-tool=''shell(git:*)'' -p "summarise the repo"'}
      - {_note: "a tool name that starts with shell", Image: /usr/local/bin/copilot, CommandLine: 'copilot --allow-tool=shellcheck -p "summarise the repo"'}
  - id: blind-spot/copilot-allow-all-tools-only
    kind: blind-spot
    quote: {source: rule, text: "--allow-all-tools is the common CI form, so matching it alone would fire on every pipeline"}
    expect: no-match
    events:
      - {Image: /usr/local/bin/copilot, CommandLine: 'copilot -p "summarise the repo" --allow-all-tools'}
  - id: blind-spot/copilot-shell-later-in-list
    kind: blind-spot
    quote: {source: rule, text: 'A list with shell after another tool (write,shell) is not matched, nor a quoted list such as "shell,write", nor a quoted shell after a space (--allow-tool "shell")'}
    expect: no-match
    events:
      - {_note: "shell after another tool", Image: /usr/local/bin/copilot, CommandLine: 'copilot -p "summarise the repo" --allow-tool=write,shell'}
      - {_note: "the quoted list form the docs give for several tools; holds only where the sensor records the quotes (Windows): a Linux or macOS argv sensor strips them and the unquoted form matches", Image: /usr/local/bin/copilot, CommandLine: 'copilot --allow-tool="shell,write" -p "summarise the repo"'}
      - {_note: "a quoted shell after a space; holds only where the sensor records the quotes (Windows): a Linux or macOS argv sensor strips them and the unquoted form matches", Image: /usr/local/bin/copilot, CommandLine: 'copilot --allow-tool "shell" -p "summarise the repo"'}
  - id: blind-spot/copilot-piped-stdin
    kind: blind-spot
    quote: {source: rule, text: "A Copilot prompt piped on stdin carries no headless flag and is not matched"}
    expect: no-match
    events:
      - {_note: "the prompt arrives on stdin from a pipe", ParentImage: /bin/sh, Image: /usr/local/bin/copilot, CommandLine: "copilot --yolo"}
  - id: catches/copilot-headless-p-last
    kind: catches
    quote: {source: rule, text: "its headless flags also include -p at the end of the line and --acp"}
    expect: match
    events:
      - {_note: "-p last, prompt on stdin", Image: /usr/local/bin/copilot, CommandLine: "copilot --yolo -p"}
  - id: catches/copilot-acp
    kind: catches
    quote: {source: rule, text: "its headless flags also include -p at the end of the line and --acp"}
    rationale: "--acp starts the CLI as an Agent Client Protocol server: https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-command-reference"
    expect: match
    events:
      - {Image: /usr/local/bin/copilot, CommandLine: "copilot --acp --yolo"}
  - id: catches/cursor-force-linux
    kind: catches
    quote: {source: rule, text: "The Cursor CLI matches as node running index.js from a cursor-agent folder, with --force, -f or --yolo"}
    expect: match
    events:
      - {_note: "the bash launcher runs exec -a on the bundled node, so the command line starts with the invoked path", Image: /home/dev/.local/share/cursor-agent/versions/2026.10.22-27dcf5f/node, CommandLine: '/home/dev/.local/bin/agent --use-system-ca /home/dev/.local/share/cursor-agent/versions/2026.10.22-27dcf5f/index.js --force "summarise the repo"'}
  - id: catches/cursor-yolo-windows
    kind: catches
    quote: {source: rule, text: "The Cursor CLI matches as node running index.js from a cursor-agent folder, with --force, -f or --yolo"}
    expect: match
    events:
      - {_note: "the node.exe row at the end of the cmd.exe and powershell.exe shim chain", Image: 'C:\Users\dev\AppData\Local\cursor-agent\versions\2026.10.22-27dcf5f\node.exe', CommandLine: '"C:\Users\dev\AppData\Local\cursor-agent\versions\2026.10.22-27dcf5f\node.exe" C:\Users\dev\AppData\Local\cursor-agent\versions\2026.10.22-27dcf5f\index.js --yolo -p "summarise the repo"'}
  - id: catches/cursor-short-f
    kind: catches
    quote: {source: rule, text: "The Cursor CLI matches as node running index.js from a cursor-agent folder, with --force, -f or --yolo"}
    expect: match
    events:
      - {_note: "-f before the prompt", Image: /home/dev/.local/share/cursor-agent/versions/2026.10.22-27dcf5f/node, CommandLine: '/home/dev/.local/bin/agent --use-system-ca /home/dev/.local/share/cursor-agent/versions/2026.10.22-27dcf5f/index.js -f "summarise the repo"'}
      - {_note: "-f last on the line", Image: /home/dev/.local/share/cursor-agent/versions/2026.10.22-27dcf5f/node, CommandLine: '/home/dev/.local/bin/agent --use-system-ca /home/dev/.local/share/cursor-agent/versions/2026.10.22-27dcf5f/index.js -p "summarise the repo" -f'}
  - id: catches/cursor-interactive-yolo
    kind: catches
    quote: {source: rule, text: "Cursor's branch needs no headless flag, because the CLI is headless whenever stdin or stdout is not a terminal, so an interactive Run Everything session also matches"}
    expect: match
    events:
      - {_note: "no -p: from a postinstall script this run is headless, from a terminal it is interactive", Image: /home/dev/.local/share/cursor-agent/versions/2026.10.22-27dcf5f/node, CommandLine: '/home/dev/.local/bin/agent --use-system-ca /home/dev/.local/share/cursor-agent/versions/2026.10.22-27dcf5f/index.js --yolo'}
  - id: catches/cursor-gemini-model
    kind: catches
    quote: {source: rule, text: "A Cursor run with a Gemini model (--model gemini-2.5-pro --yolo -p) also satisfies the node Gemini branch"}
    expect: match
    events:
      - {Image: /home/dev/.local/share/cursor-agent/versions/2026.10.22-27dcf5f/node, CommandLine: '/home/dev/.local/bin/agent --use-system-ca /home/dev/.local/share/cursor-agent/versions/2026.10.22-27dcf5f/index.js --model gemini-2.5-pro --yolo -p "summarise the repo"'}
  - id: near-miss/cursor-no-bypass
    kind: near-miss
    rationale: "Cursor headless with its approvals left on is ordinary scripted use"
    expect: no-match
    events:
      - {Image: /home/dev/.local/share/cursor-agent/versions/2026.10.22-27dcf5f/node, CommandLine: '/home/dev/.local/bin/agent --use-system-ca /home/dev/.local/share/cursor-agent/versions/2026.10.22-27dcf5f/index.js -p "summarise the repo"'}
  - id: near-miss/cursor-shim-powershell
    kind: near-miss
    quote: {source: rule, text: "Keying on node, not on the cmd.exe and powershell.exe shims or the bash launcher that carry the same flags, avoids repeat alerts for one launch."}
    rationale: "The Windows shim passes the same flags on to node.exe; only the node.exe row matches, so one launch gives one alert"
    expect: no-match
    events:
      - {_note: "the PowerShell shim row, not node", Image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe', CommandLine: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\Users\dev\AppData\Local\cursor-agent\cursor-agent.ps1 --force'}
  - id: blind-spot/cursor-approval-mode-config
    kind: blind-spot
    quote: {source: rule, text: "approvalMode \"unrestricted\" in the user's cli-config.json switches approvals off with nothing on the command line and is not seen"}
    expect: no-match
    events:
      - {_note: "approvalMode unrestricted set in cli-config.json, nothing on argv", Image: /home/dev/.local/share/cursor-agent/versions/2026.10.22-27dcf5f/node, CommandLine: '/home/dev/.local/bin/agent --use-system-ca /home/dev/.local/share/cursor-agent/versions/2026.10.22-27dcf5f/index.js -p "summarise the repo"'}
  - id: catches/devin-dangerous
    kind: catches
    quote: {source: rule, text: 'Devin CLI matches as devin from a bin folder (/bin/devin or \bin\devin.exe, never the Devin.exe editor) with --permission-mode dangerous, yolo or bypass'}
    expect: match
    events:
      - {_note: "standalone CLI on Linux; the image resolves to the versions folder", Image: /home/dev/.local/share/devin/cli/_versions/3000.11.228/bin/devin, CommandLine: 'devin --permission-mode dangerous -p "summarise the repo"'}
      - {_note: "the mode last on the line", Image: /home/dev/.local/share/devin/cli/_versions/3000.11.228/bin/devin, CommandLine: 'devin --print "summarise the repo" --permission-mode dangerous'}
  - id: catches/devin-yolo-equals
    kind: catches
    quote: {source: rule, text: "written with a space or =, and followed by a space or the end of the line, and -p or --print"}
    expect: match
    events:
